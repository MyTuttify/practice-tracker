    <title>Tuttify</title>
    <script>
      // Thema van de eerste tekening, nog vóór de app laadt: licht (de standaard, Wit) of donker bij een
      // onthouden donkere keuze (pt-appearance, zie src/features/appearance/appearance.ts). De lichte
      // achtergronden staan hieronder; appearance.test.ts controleert dat die lijst klopt.
      (function () {
        try {
          var a = JSON.parse(localStorage.getItem('pt-appearance') || 'null');
          if (a && ['white', 'hearts', 'paper', 'waves', 'dots'].indexOf(a.background) < 0) {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b0f17');
          }
        } catch (e) {
          /* geen opslag: licht */
        }
      })();
    </script>
