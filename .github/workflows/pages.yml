name: Publiceer op GitHub Pages

# Gratis voor openbare repo's. Publiceert alleen de (versleutelde) bestanden uit deze repo.
# Wordt geschreven door scripts/build-protected.mjs (bron in de privérepo); niet hier aanpassen.
# Alleen GitHubs eigen actions, elk vastgezet op de commit van een release (ook geen geneste
# actions op een tag, zodat 'Require actions to be pinned to a full-length commit SHA' kan).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      # Zelfde inpakstap als actions/upload-pages-artifact, maar zonder geneste actie op een tag
      # (werkt ook met 'Require actions to be pinned to a full-length commit SHA')
      - name: Site inpakken (zonder .git en .github)
        run: tar --dereference --hard-dereference --directory . -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
