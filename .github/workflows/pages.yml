name: Publiceer op GitHub Pages

# Gratis voor openbare repo's. Publiceert alleen de (versleutelde) bestanden uit deze repo.
# Wordt geschreven door scripts/build-protected.mjs (bron in de privérepo); niet hier aanpassen.
# Alleen GitHubs eigen actions, elk vastgezet op de commit van een release (upload-pages-artifact
# gebruikt intern actions/upload-artifact@v4).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1 (slaat .git en .github over)
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
